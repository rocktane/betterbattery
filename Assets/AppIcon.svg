<defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34343a"/><stop offset="0.3" stop-color="#1f1f23"/><stop offset="1" stop-color="#0c0c0e"/></linearGradient>
